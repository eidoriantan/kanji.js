    <script>
      // Apply the saved or system color mode before first paint.
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })();
      // GitHub Pages SPA fallback: restore the path that 404.html encoded.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location);
    </script>

  <body>
    <div id="root"></div>
    <noscript>kanji.js.org needs JavaScript. You can read the library's README on <a href="https://github.com/eidoriantan/kanji.js">GitHub</a>.</noscript>
