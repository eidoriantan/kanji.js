<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kanji.js</title>
    <script>
      // GitHub Pages serves this file for unknown paths. Encode the path into the
      // query string and redirect to the app, which restores it (see index.html).
      // Based on https://github.com/rafgraph/spa-github-pages (MIT).
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
